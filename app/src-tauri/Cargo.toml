[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS desktop shell (Tauri 2): lifecycle, tray, orb window, service supervisor"
edition = "2021"
rust-version = "1.80"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
